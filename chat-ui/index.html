<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente IA Local</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #252533;
      --border: #2e2e42;
      --text: #e8e8f0;
      --text-muted: #7878a0;
      --accent: #7c6af7;
      --accent-hover: #9080ff;
      --user-bubble: #2d2b52;
      --agent-bubble: #1e1e2e;
      --code-bg: #12121a;
      --scrollbar: #2e2e42;
      --input-bg: #1a1a24;
      --danger: #e05c5c;
    }
    :root[data-theme="light"] {
      --bg: #f4f4f8;
      --surface: #ffffff;
      --surface2: #eeeef5;
      --border: #d8d8e8;
      --text: #1a1a2e;
      --text-muted: #8888aa;
      --accent: #6355d8;
      --accent-hover: #7c6af7;
      --user-bubble: #ede9ff;
      --agent-bubble: #ffffff;
      --code-bg: #f0f0f8;
      --scrollbar: #d0d0e0;
      --input-bg: #ffffff;
      --danger: #c94040;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 6px #4caf5088;
      flex-shrink: 0;
    }
    .status-dot.offline { background: var(--danger); box-shadow: none; }
    h1 { font-size: 15px; font-weight: 600; }
    .subtitle { font-size: 11px; color: var(--text-muted); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    button.icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
      white-space: nowrap;
    }
    button.icon-btn:hover { color: var(--text); border-color: var(--accent); }

    /* ── Config panel ── */
    #config-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: none;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    #config-panel.open { display: flex; }
    .config-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
    .config-field label { font-size: 11px; color: var(--text-muted); }
    .config-field input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }
    .config-field input:focus { border-color: var(--accent); }
    #config-panel .save-btn {
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 7px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      align-self: flex-end;
    }
    #config-panel .save-btn:hover { background: var(--accent-hover); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar) transparent;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 820px;
      width: 100%;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.agent { align-self: flex-start; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
    }
    .msg-row.user .avatar { background: var(--accent); border-color: var(--accent); }

    .bubble {
      border-radius: 14px;
      padding: 11px 15px;
      font-size: 14px;
      line-height: 1.6;
      max-width: calc(100% - 44px);
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--border);
      border-top-right-radius: 4px;
    }
    .msg-row.agent .bubble {
      background: var(--agent-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 5px;
      text-align: right;
    }
    .msg-row.agent .msg-time { text-align: left; }

    /* Markdown styles inside bubbles */
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      color: #a6e3a1;
    }
    .bubble pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble pre code {
      background: none;
      padding: 0;
      font-size: 12px;
      line-height: 1.5;
      color: #cdd6f4;
    }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble li { margin: 3px 0; }
    .bubble strong { color: var(--accent-hover); }
    .bubble h1,.bubble h2,.bubble h3 {
      font-size: 14px; font-weight: 700; margin: 10px 0 6px;
    }

    /* Typing indicator */
    .typing-bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 14px 18px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: scale(1); opacity: .5; }
      40% { transform: scale(1.3); opacity: 1; }
    }

    /* Empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      text-align: center;
    }
    #empty-state .icon { font-size: 48px; }
    #empty-state h2 { font-size: 20px; color: var(--text); }
    #empty-state p { font-size: 14px; max-width: 380px; line-height: 1.6; }
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 8px;
    }
    .suggestion-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 20px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
    }
    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Input ── */
    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 820px;
      margin: 0 auto;
    }
    #user-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      max-height: 160px;
      transition: border-color .15s;
      scrollbar-width: thin;
    }
    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--text-muted); }
    #send-btn {
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled { background: var(--surface2); cursor: not-allowed; }
    .input-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 9px 18px; border-radius: 20px;
      font-size: 13px; opacity: 0; transition: opacity .3s;
      pointer-events: none; z-index: 100;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="status-dot" id="status-dot"></div>
    <div>
      <h1>Agente IA Local</h1>
      <div class="subtitle" id="model-label">gemma3:12b · Ollama local</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleTheme()">◐ Tema</button>
    <button class="icon-btn" onclick="toggleConfig()">⚙ Config</button>
    <button class="icon-btn" onclick="newSession()" style="color:var(--danger)">↺ Nueva sesión</button>
  </div>
</header>

<div id="config-panel">
  <div class="config-field">
    <label>URL n8n (Chat Trigger)</label>
    <input id="cfg-url" type="text" placeholder="http://localhost:5678/webhook/chat-agente-principal" />
  </div>
  <div class="config-field" style="max-width:200px">
    <label>Modelo (solo visual)</label>
    <input id="cfg-model" type="text" placeholder="gemma3:12b" />
  </div>
  <button class="save-btn" onclick="saveConfig()">Guardar</button>
</div>

<div id="messages">
  <div id="empty-state">
    <div class="icon">🤖</div>
    <h2>Agente listo</h2>
    <p>Puedo buscar en mi memoria, crear workflows en n8n, ejecutar código y hacer requests HTTP.</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this)">¿Qué recordás de sesiones anteriores?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Creá un workflow que envíe un email diario con el clima</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Consultá la API de GitHub y guardá el resultado</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">¿Qué workflows creaste hasta ahora?</button>
    </div>
  </div>
</div>

<div id="input-area">
  <div class="input-row">
    <textarea id="user-input" rows="1" placeholder="Escribí tu instrucción..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Enviar (Enter)">➤</button>
  </div>
  <div class="input-hint">Enter para enviar · Shift+Enter nueva línea</div>
</div>

<div id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const DEFAULT_URL = 'http://localhost:5678/webhook/chat-agente-principal';

function loadConfig() {
  return {
    url:   localStorage.getItem('n8n_url')   || DEFAULT_URL,
    model: localStorage.getItem('n8n_model') || 'gemma3:12b',
  };
}

function saveConfig() {
  const url   = document.getElementById('cfg-url').value.trim()   || DEFAULT_URL;
  const model = document.getElementById('cfg-model').value.trim() || 'gemma3:12b';
  localStorage.setItem('n8n_url',   url);
  localStorage.setItem('n8n_model', model);
  document.getElementById('model-label').textContent = `${model} · Ollama local`;
  toggleConfig();
  toast('Configuración guardada');
}

function initConfig() {
  const cfg = loadConfig();
  document.getElementById('cfg-url').value   = cfg.url;
  document.getElementById('cfg-model').value = cfg.model;
  document.getElementById('model-label').textContent = `${cfg.model} · Ollama local`;
}

// ── Session ───────────────────────────────────────────────────────────────────
function getSessionId() {
  let sid = sessionStorage.getItem('session_id');
  if (!sid) {
    sid = 'ses-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    sessionStorage.setItem('session_id', sid);
  }
  return sid;
}

function newSession() {
  if (!confirm('¿Iniciar una nueva conversación? El agente no recordará este chat.')) return;
  sessionStorage.removeItem('session_id');
  document.getElementById('messages').innerHTML = '<div id="empty-state">...</div>';
  location.reload();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
let emptyRemoved = false;

function removeEmpty() {
  if (!emptyRemoved) {
    const el = document.getElementById('empty-state');
    if (el) el.remove();
    emptyRemoved = true;
  }
}

function appendMessage(role, text, time) {
  removeEmpty();
  const msgs = document.getElementById('messages');
  const isUser = role === 'user';

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = isUser ? '👤' : '🤖';

  const wrap = document.createElement('div');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (isUser) {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = marked.parse(text || '');
  }

  const timeEl = document.createElement('div');
  timeEl.className = 'msg-time';
  timeEl.textContent = time || now();

  wrap.appendChild(bubble);
  wrap.appendChild(timeEl);
  row.appendChild(avatar);
  row.appendChild(wrap);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function showTyping() {
  removeEmpty();
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.id = 'typing-row';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble typing-bubble';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

function setStatus(online) {
  const dot = document.getElementById('status-dot');
  dot.classList.toggle('offline', !online);
}

function now() {
  return new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}

function toast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function toggleConfig() {
  document.getElementById('config-panel').classList.toggle('open');
}

function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', html.dataset.theme);
}

function sendSuggestion(btn) {
  document.getElementById('user-input').value = btn.textContent;
  sendMessage();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Send ──────────────────────────────────────────────────────────────────────
let isSending = false;

async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  isSending = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  appendMessage('user', text);
  showTyping();

  const cfg = loadConfig();
  const sessionId = getSessionId();

  try {
    const res = await fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chatInput: text,
        sessionId: sessionId,
      }),
    });

    removeTyping();

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }

    const data = await res.json();

    // n8n chatTrigger puede responder en distintos formatos
    const reply =
      data?.output ||
      data?.text ||
      data?.message ||
      data?.response ||
      data?.result ||
      (typeof data === 'string' ? data : JSON.stringify(data, null, 2));

    appendMessage('agent', reply);
    setStatus(true);

  } catch (err) {
    removeTyping();
    setStatus(false);

    let errMsg = err.message;
    if (err.message.includes('fetch')) {
      errMsg = `No se pudo conectar con n8n.\n\n**Chequeá:**\n- ¿Está corriendo \`docker compose up\`?\n- URL configurada: \`${cfg.url}\`\n- ¿Están activados los workflows 02, 03, 04?`;
    }

    appendMessage('agent', `⚠️ **Error de conexión**\n\n${errMsg}`);
    toast('Error al conectar con n8n', 3500);
  }

  isSending = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  // Restaurar tema
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.dataset.theme = savedTheme;

  initConfig();

  // Precargar estado de conexión
  const cfg = loadConfig();
  fetch(cfg.url, { method: 'HEAD' })
    .then(() => setStatus(true))
    .catch(() => setStatus(false));

  document.getElementById('user-input').focus();
})();
</script>
</body>
</html>
